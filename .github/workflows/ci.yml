# Continuous integration for the portfolio.
#
# Runs on every push to main and on every pull request. Because main
# auto-deploys to Vercel, this is the only gate between a bad commit and
# the live site — keep it green.
#
# The three checks mirror `npm run verify`, but run as SEPARATE steps on
# purpose: `verify` chains them with `&&`, so a type error would mask
# whether lint also fails. Split out, the GitHub UI names the one that broke.
#
# PORT-042 (2026-09-15) — the env: block below is INSURANCE, not a current
# requirement, and the distinction was measured rather than assumed.
#
# The note that stood here predicted this job would go red once `lib/env.ts`
# threw at module load. It does throw — but `next build` passed green with no
# .env.local at all, 21 routes, because of where env.ts sits in the import
# graph:
#
#   env.ts <- email.ts <- lib/actions/contact.ts <- contact-form.tsx ("use client")
#
# Module-scope code in a "use server" file reached only from a Client Component
# is COMPILED but never EVALUATED during prerendering. /contact is ○ static and
# its page imports <ContactForm>, not the action; the action is a network
# endpoint invoked on submission. So `required("RESEND_API_KEY")` runs at
# request time, not at build time, and the prediction was wrong.
#
# The block stays anyway because it costs nothing and the graph is one import
# away from changing: anything on a STATIC path that reads env.ts — lib/seo.ts
# picking up SITE_URL would do it — makes these vars genuinely required at
# build time. Keeping them here means that change does not also become a
# confusing red pipeline.
#
# They are GitHub repository secrets, never literals: RESEND_API_KEY is a
# genuine secret; the other two are not sensitive but live alongside it so
# there is one place to look. A missing secret substitutes an empty string,
# which is inert today. A red build reading "Missing required environment
# variable" means a secret is absent, not that the code is broken.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first run still in flight,
# so a quick follow-up commit does not queue behind a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Read the version from .nvmrc rather than hardcoding it here,
          # so the pin lives in exactly one place and cannot drift.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # `npm ci` installs from package-lock.json exactly and fails if the
        # lockfile and package.json disagree. Never `npm install` in CI —
        # it can silently resolve a different tree than the one tested locally.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npm run build
